{% extends "base.html" %}

{% block title %}首頁 - SELA 快點來點餐{% endblock %}

{% block content %}
{# V2.17.0 IA：原本的「我的進行中」併入片段的「要你處理的」，首頁內容全部在 partials/home_groups.html #}
<div id="group-list" 
     hx-get="/home/groups" 
     hx-trigger="refreshGroups from:body"
     hx-swap="innerHTML">
    {% include "partials/home_groups.html" %}
</div>

<script>
let refreshScheduled = false;

function countdown(deadline) {
    return {
        display: '',
        urgent: false,
        init() {
            this.update();
            setInterval(() => this.update(), 60000);
        },
        update() {
            const now = new Date();
            const end = new Date(deadline);
            const diff = end - now;
            this.urgent = diff > 0 && diff < 15 * 60 * 1000;
            
            if (diff <= 0) {
                this.display = '已截止';
                // 觸發首頁刷新（防止重複觸發）
                if (!refreshScheduled) {
                    refreshScheduled = true;
                    setTimeout(() => {
                        htmx.trigger('#group-list', 'refreshGroups');
                        refreshScheduled = false;
                    }, 2000);
                }
                return;
            }
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            // V2.17.0：顯示「剩 …」，已截止時不會出現「剩 已截止」
            if (hours > 24) {
                const days = Math.floor(hours / 24);
                this.display = `剩 ${days} 天`;
            } else if (hours > 0) {
                this.display = `剩 ${hours}h ${minutes}m`;
            } else {
                this.display = `剩 ${minutes}m`;
            }
        }
    }
}
</script>
{% endblock %}
