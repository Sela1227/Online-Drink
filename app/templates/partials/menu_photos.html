{# V2.35.0：店家菜單照片——一排縮圖（Sela 選 B），點了全螢幕左右滑。團頁與店家頁共用。
   用法：{% with photos = store.menu_photos %}{% include "partials/menu_photos.html" %}{% endwith %}
   網址放 data-*（JSON 字串），不進 Alpine 表達式（坑 #37） #}
{% if photos %}
<div id="menu-photos-strip" class="mb-3" data-photos="{{ photos | tojson | forceescape }}"
     x-data="{ open: false, i: 0, list: [], x0: null,
               show(n) { this.list = JSON.parse(this.$root.dataset.photos); this.i = n; this.open = true; document.body.classList.add('overflow-hidden'); },
               close() { this.open = false; document.body.classList.remove('overflow-hidden'); },
               go(d) { const n = this.list.length; this.i = (this.i + d + n) % n; } }"
     @keydown.escape.window="open && close()" @keydown.arrow-right.window="open && go(1)" @keydown.arrow-left.window="open && go(-1)">
    <div class="flex gap-2 overflow-x-auto pb-1">
        {% for u in photos %}
        <button type="button" @click="show({{ loop.index0 }})" aria-label="看菜單照片第 {{ loop.index }} 張"
                class="flex-shrink-0 w-20 h-20 rounded-lg overflow-hidden border border-sela-200 bg-sela-50">
            <img src="{{ u }}" alt="" loading="lazy" class="w-full h-full object-cover">
        </button>
        {% endfor %}
    </div>
    <div x-show="open" x-cloak id="menu-photo-viewer" class="fixed inset-0 z-[60] bg-black flex flex-col" role="dialog" aria-label="菜單照片"
         @touchstart="x0 = $event.touches[0].clientX"
         @touchend="if (x0 !== null) { const dx = $event.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); x0 = null; }">
        <div class="flex items-center justify-between px-4 py-3 text-white" style="padding-top: calc(0.75rem + env(safe-area-inset-top))">
            <button type="button" @click="close()" class="w-10 h-10 -ml-2 flex items-center justify-center" aria-label="關閉"><i class="ti ti-x text-2xl"></i></button>
            <span class="text-sm" x-text="(i + 1) + ' / ' + list.length"></span>
            <a :href="list[i]" target="_blank" rel="noopener" class="text-sm underline">原圖</a>
        </div>
        <div class="relative flex-1 min-h-0 flex items-center justify-center">
            <img :src="open ? list[i] : ''" alt="菜單照片" class="max-w-full max-h-full object-contain select-none">
            <template x-if="list.length > 1">
                <div>
                    <button type="button" @click="go(-1)" aria-label="上一張" class="absolute left-1 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/15 text-white flex items-center justify-center"><i class="ti ti-chevron-left text-xl"></i></button>
                    <button type="button" @click="go(1)" aria-label="下一張" class="absolute right-1 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/15 text-white flex items-center justify-center"><i class="ti ti-chevron-right text-xl"></i></button>
                </div>
            </template>
        </div>
    </div>
</div>
{% endif %}
